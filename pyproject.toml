[project]
name = "requiem"
version = "0.1.0"
description = "Hyper Local Business & Loan Advisory"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi",
    "uvicorn[standard]",
    "sqlmodel",
    "itsdangerous",
    "python-multipart",
    "openai",
    "rank-bm25",
    "python-dotenv",
]

[dependency-groups]
dev = ["pytest", "httpx"]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
